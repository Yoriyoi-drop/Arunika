[package]
name = "arunika-host-linux"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
arunika-graphics-engine = { path = "../graphics-engine" }
arunika-sandbox-manager = { path = "../sandbox-manager" }
libc = "0.2"
minifb = "0.25"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
arunika-test-fixtures = { path = "../test-fixtures" }
serde_json = "1"